<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Management{% endblock %}</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-container">
        {% block sidebar %}
        <!-- Admin Sidebar -->
        <div class="dossier-sidebar">
            <h2 class="dossier-name">Library</h2>
            <div class="dossier-actions">
                <!-- Library Category -->
                <div class="custom-style-35">Library</div>
                <a href="{% url 'transactions' %}" class="dossier-btn {% if request.resolver_match.url_name == 'transactions' %}active{% endif %}">Dashboard</a>
                <a href="{% url 'all_transactions' %}" class="dossier-btn {% if request.resolver_match.url_name == 'all_transactions' %}active{% endif %}">Transactions</a>
                <a href="{% url 'issue_book' %}" class="dossier-btn {% if request.resolver_match.url_name == 'issue_book' %}active{% endif %}">Issue Book</a>
                <a href="{% url 'return_book_page' %}" class="dossier-btn {% if request.resolver_match.url_name == 'return_book_page' %}active{% endif %}">Return Book</a>
                <a href="{% url 'customers' %}" class="dossier-btn {% if request.resolver_match.url_name == 'customers' %}active{% endif %}">Customers</a>

                <!-- Book Category -->
                <div class="custom-style-36">Book</div>
                <a href="{% url 'dashboard' %}" class="dossier-btn {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Manage Books</a>
                <a href="{% url 'add_book' %}" class="dossier-btn {% if request.resolver_match.url_name == 'add_book' %}active{% endif %}">Add Book</a>
                
                <a href="{% url 'logout' %}" class="dossier-btn danger custom-style-37">Logout</a>
            </div>
        </div>
        {% endblock %}

        <div class="main-content">
            <div class="content-wrapper">

                <div class="messages">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="message {{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                </div>

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
