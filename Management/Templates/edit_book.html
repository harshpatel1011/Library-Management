{% extends 'base.html' %}


{% block content %}
<div class="page-header custom-style-1">
    <div class="header-text">
        <h1 class="custom-style-2">Edit Book</h1>
        <p class="custom-style-3">Update details for "{{ book.title }}".</p>
    </div>
    <div class="header-actions">
        <a href="{% url 'dashboard' %}" class="btn-secondary custom-style-4">
            <i class="fa-solid fa-arrow-left custom-style-5"></i> Back to Dashboard
        </a>
    </div>
</div>

<div class="custom-style-6">
    <form method="POST" action="{% url 'edit_book' book.id %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid custom-style-7">
            
            <div class="form-group custom-style-8">
                <label class="form-label">Book Title</label>
                <input class="form-input" type="text" name="title" value="{{ book.title }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Author</label>
                <input class="form-input" type="text" name="author" value="{{ book.author }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Read Price (Rs)</label>
                <input class="form-input" type="number" step="0.01" name="read_price" value="{{ book.read_price }}" required>
            </div>
            
            <div class="form-group custom-style-8">
                <label class="form-label">Description</label>
                <textarea class="form-input" name="description" rows="5" required>{{ book.description }}</textarea>
            </div>
            
            <div class="form-group custom-style-8">
                <label class="form-label">Book Images</label>
                
                {% if book.images.all %}
                <div class="custom-style-78" id="existing-images-container">
                    {% for img in book.images.all %}
                        <div class="existing-image-wrapper custom-style-79">
                            <img class="custom-style-80" src="{{ img.image.url }}" alt="Gallery Image">
                            <button class="custom-style-81" type="button" onclick="removeGalleryImage(this, {{ img.id }})" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='none'"><i class="fa-solid fa-xmark custom-style-82"></i></button>
                        </div>
                    {% endfor %}
                </div>
                <div id="delete-image-inputs"></div>
                {% endif %}

                <div class="file-upload-wrapper">
                    <input type="file" class="form-input custom-style-9" name="images" id="product_image" multiple>
                    <div class="file-upload-placeholder custom-style-10" id="file-name" onclick="document.getElementById('product_image').click();">
                        <i class="fa-solid fa-cloud-arrow-up custom-style-11"></i>
                        <div class="custom-style-12">Click to upload images</div>
                        <div class="custom-style-13">PNG, JPG up to 5MB</div>
                    </div>
                </div>
            </div>
            


            <script>
                function removeGalleryImage(btn, id) {
                    btn.closest('.existing-image-wrapper').style.display = 'none';
                    document.getElementById('delete-image-inputs').innerHTML += '<input type="hidden" name="delete_gallery_images" value="' + id + '">';
                }
                
                function clearImageSelection(e) {
                    e.stopPropagation();
                    document.getElementById('product_image').value = '';
                    document.getElementById('file-name').innerHTML = `
                        <i class="fa-solid fa-cloud-arrow-up custom-style-11"></i>
                        <div class="custom-style-12">Click to upload images</div>
                        <div class="custom-style-13">PNG, JPG up to 5MB</div>
                    `;
                }

                document.getElementById('product_image').addEventListener('change', function(e) {
                    const files = e.target.files;
                    if (files.length > 0) {
                        const text = files.length === 1 ? files[0].name : `${files.length} images selected`;
                        document.getElementById('file-name').innerHTML = `
                            <i class="fa-solid fa-images custom-style-11"></i>
                            <div class="custom-style-14">${text}</div>
                            <button type="button" class="dossier-btn dossier-btn-dark danger custom-style-15" onclick="clearImageSelection(event)"><i class="fa-solid fa-xmark"></i> Clear Selection</button>
                        `;
                    }
                });
            </script>
        </div>
        
        <div class="custom-style-16">
            <button type="submit" class="btn-primary custom-style-17"><i class="fa-solid fa-save custom-style-5"></i> Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
